[project]
name = "code-fixer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Riccardo Caporali" }]
license = { text = "MIT" }

dependencies = [
    "google-genai==1.12.1",
    "python-dotenv==1.1.0",
    "httpx==0.28.1",
    "websockets==15.0.1",
    "tqdm==4.67.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.1",
]

[tool.isort]
profile = "black"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[project.scripts]
aicodeagent = "aicodeagent.cli:main"
